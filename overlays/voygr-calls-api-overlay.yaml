    https://api.voygr.tech"), and is the host that serves this very document.
    dev.voygr.tech serves a byte-identical copy of this spec and additionally
    hosts the Business Validation API.
  update:
    servers:
    - url: https://api.voygr.tech
      description: Production
    - url: https://dev.voygr.tech
      description: >-
        Serves an identical copy of this contract; also hosts the Business
        Validation API (POST /v1/business-status, POST /signup), which is not
        described in this document.
- target: $.components
  description: >-
    Declare the API-key security scheme. The published document has no
    components.securitySchemes, so a generated client or an agent reading the
    contract mechanically cannot learn that the API is authenticated. The scheme
    is documented in prose in info.description ("Every request needs the
    X-API-Key header").
  update:
    securitySchemes:
      ApiKeyAuth:
        type: apiKey
        in: header
        name: X-API-Key
        description: >-
          Per-customer API key carrying a credit quota, rate limits, and a
          concurrent-call limit. Self-serve at https://api.voygr.tech/checkout;
          the key is emailed and never returned in an API response. Rotate at
          https://api.voygr.tech/recover.
- target: $
  description: >-
    Apply the security scheme document-wide. GET /health is exempted below
    because it answers 200 unauthenticated (probed 2026-08-14).
  update:
    security:
    - ApiKeyAuth: []
- target: $.paths['/health'].get
  description: GET /health is unauthenticated — verified by live probe returning 200 {"status":"ok"} with no key.
  update:
