aid: voygr
name: VOYGR
description: >-
  VOYGR provides real-world place intelligence for AI apps and agents, delivering
  continuous location and point-of-interest (POI) data validation and enrichment.
  Its Location Freshness Validation confirms historical existence and current
  operating status, detecting relocations, rebrands, and closures across multiple
  attributes with up to 99.62% validation precision and configurable decision
  thresholds. Its Location Data Enrichment populates and continuously enriches
  place records from web, social, authoritative, and other sources, spanning
  foundational attributes (address, contacts, web presence), operating data
  (hours, menus, prices), and fresh context (articles, reviews, news, events).
  VOYGR is a Y Combinator (Winter 2026) and SNR.VC backed seed-stage company
  based in San Francisco, founded by Vlad Baskakov (CEO, ex-Google Maps) and
  Yarik Markov (CTO, ex-Google/Meta/Apple ML). Its maps API goes beyond the
  10-15 standard attributes of existing mapping providers. The developer surface
  is currently demo-gated and no public API documentation is published yet.
