- name: Voygr Business Validation API
  description: >-
    Business existence and operating-status validation. POST /v1/business-status
    takes a business name and a full street address and returns existence_status
    (exists, not_exists, uncertain) and open_closed_status (open, closed,
    uncertain) with a request_id and an ISO 8601 validation timestamp; GET
    /v1/usage returns the remaining quota. POST /signup issues an API key by
    email with no authentication required. Authenticated with the same X-API-Key
    header and drawn from the same credit balance as the Calls API, at 1 credit
    per request. Documented in the first-party dev-tools README and wrapped by
    the official voygr CLI and Python client; no OpenAPI is published for this
    surface.
  humanURL: https://github.com/voygr-tech/dev-tools#api-reference
  baseURL: https://dev.voygr.tech
  x-base-url-note: >-
    `dev.voygr.tech` reads like a non-production host but it IS the production
    base URL VOYGR publishes for this API: it is the hardcoded CLI/library
    default in voygr-tech/dev-tools (src/voygr/cli.py), the "Base URL" in that
    repo's API reference, and the Homepage on the PyPI package. It also serves a
    byte-identical copy of the Calls API OpenAPI. Do not "repair" it to
    api.voygr.tech — that would point this entry at a different contract.
