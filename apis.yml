aid: voygr
name: VOYGR
description: >-
  VOYGR provides real-world place intelligence for AI apps and agents, delivering
  continuous location and point-of-interest (POI) data validation and enrichment.
  Its Location Freshness Validation confirms historical existence and current
  operating status, detecting relocations, rebrands, and closures across multiple
  attributes with up to 99.62% validation precision and configurable decision
  thresholds. Its Location Data Enrichment populates and continuously enriches
  place records from web, social, authoritative, and other sources, spanning
  foundational attributes (address, contacts, web presence), operating data
  (hours, menus, prices), and fresh context (articles, reviews, news, events).
  Two APIs are public and self-serve. The Voygr Calls API (api.voygr.tech)
  places real outbound phone calls with an AI voice agent — submit a task, the
  agent dials, conducts the conversation, and returns a structured outcome with
  a full transcript — which is how VOYGR reaches the businesses that have a
  phone but no API. The Voygr Business Validation API (dev.voygr.tech) returns
  existence and open/closed status for a business name and address. Both
  authenticate with an X-API-Key header, share one prepaid credit balance, and
  issue keys self-serve by email. VOYGR is a Y Combinator (Winter 2026) and
  SNR.VC backed seed-stage company based in San Francisco, founded by Vlad
  Baskakov (CEO, ex-Google Maps) and Yarik Markov (CTO, ex-Google/Meta/Apple ML).
  Its maps API goes beyond the 10-15 standard attributes of existing mapping
  providers. The location-data products themselves remain demo-gated on
  voygr.tech, but the calling and validation APIs are documented, priced, and
  reachable without a sales conversation.
