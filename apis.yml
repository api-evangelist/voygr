apis:
- name: Voygr Calls API
  description: >-
    Programmatic outbound phone calls executed by an AI voice agent. Submit a
    task either as a plain-language brief or as a structured intent plus slots
    (inquiry, info_gathering, issue_resolution, booking, cancellation); the agent
    places the call, works through phone trees and hold, conducts the
    conversation in one of 13 languages, and returns a structured outcome with a
    full transcript. Calls are asynchronous — poll the call until it reaches a
    terminal state, or cursor-poll an SSE-formatted event feed for live progress
    and mid-call questions. A post-call merged transcript is rebuilt from the
    dual-channel recording. OpenAPI 3.1.0, 13 operations, X-API-Key auth, US
    destinations only, AI disclosure and recording notice on every call.
  humanURL: https://api.voygr.tech/docs
  baseURL: https://api.voygr.tech
  tags:
  - voice-ai
  - telephony
  - outbound-calls
  - ai-agents
  - agent-skills
  - transcription
  - booking
