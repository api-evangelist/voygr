openapi: 3.2.0
info:
  title: Voygr Calls Core API
  description: Programmatic outbound phone calls executed by an AI voice agent.
  version: 1.0.0
tags:
- name: Core
paths:
  /health:
    get:
      tags:
      - Core
      summary: Health check
      description: Check if the API server is running
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/usage:
    get:
      tags:
      - Core
      summary: Get API usage statistics
      description: Get current usage, quota, and reset date for the API key.
      operationId: get_usage_v1_usage_get
      parameters:
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
        '401':
          description: Missing API key header
          content:
            application/json:
              example:
                success: false
                error: API key required. Include X-API-Key header.
                error_code: AUTHENTICATION_ERROR
                request_id: ad33009a-fdfe-4e25-9650-4a49099c3d4a
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Invalid, revoked, or unauthorized API key
          content:
            application/json:
              example:
                success: false
                error: Invalid or revoked API key
                error_code: AUTHENTICATION_ERROR
                request_id: 25b104f0-9ad0-4fc7-8530-c5d5ff8d9698
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ErrorResponse:
      properties:
        success:
          type: boolean
          title: Success
          description: Always false for errors
          default: false
        error:
          type: string
          title: Error
          description: Error message
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
          description: Error category code (VALIDATION_ERROR, MODEL_ERROR, EXTERNAL_API_ERROR, etc.)
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Request ID for tracing
        validation_timestamp:
          anyOf:
          - type: string
          - type: 'null'
          title: Validation Timestamp
          description: UTC timestamp when error response was produced (ISO 8601).
        detail:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Detail
          description: Additional error details
      type: object
      required:
      - error
      title: ErrorResponse
      description: Error response model.
      examples:
      - success: false
        error: API key required. Include X-API-Key header.
        error_code: AUTHENTICATION_ERROR
        request_id: ad33009a-fdfe-4e25-9650-4a49099c3d4a
      - success: false
        error: Invalid or revoked API key
        error_code: AUTHENTICATION_ERROR
        request_id: 25b104f0-9ad0-4fc7-8530-c5d5ff8d9698
    UsageResponse:
      properties:
        tier:
          type: string
          title: Tier
          description: API key tier (free, paid, enterprise)
        api_key_id:
          type: string
          title: Api Key Id
          description: API key ID
        customer_name:
          type: string
          title: Customer Name
          description: Customer name
        quota_limit:
          type: integer
          title: Quota Limit
          description: Maximum requests allowed per period
        current_usage:
          type: integer
          title: Current Usage
          description: Current usage count
        remaining:
          type: integer
          title: Remaining
          description: Remaining requests
        available:
          anyOf:
          - type: integer
          - type: 'null'
          title: Available
          description: Credits spendable right now — same value as `remaining`, named for the question callers ask. Already net of credits frozen by in-flight reservations.
        call_credit_hold:
          anyOf:
          - type: integer
          - type: 'null'
          title: Call Credit Hold
          description: Credits ONE outbound call freezes at dial time (a refundable hold, not a charge). available // call_credit_hold is the CREDIT-limited bound on calls in flight — entitlement and the per-customer concurrency cap gate independently, so it is not a guarantee that many will start.
        percentage_used:
          type: number
          title: Percentage Used
          description: Percentage of quota used
        reset_date:
          type: string
          title: Reset Date
          description: Date when usage resets (YYYY-MM-DD)
        period:
          type: string
          title: Period
          description: Quota period (monthly, weekly, daily)
        status:
          type: string
          title: Status
          description: API key status (active, revoked, suspended)
        validation_timestamp:
          anyOf:
          - type: string
          - type: 'null'
          title: Validation Timestamp
          description: UTC timestamp when usage response was produced (ISO 8601).
      type: object
      required:
      - tier
      - api_key_id
      - customer_name
      - quota_limit
      - current_usage
      - remaining
      - percentage_used
      - reset_date
      - period
      - status
      title: UsageResponse
      description: Response model for usage endpoint.
      examples:
      - api_key_id: f4d0a2c2-f73f-4de6-ac3e-f42ce35af4d6
        customer_name: Acme Inc
        quota_limit: 10000
        current_usage: 2375
        remaining: 7625
        percentage_used: 23.75
        reset_date: '2026-03-31'
        period: monthly
        status: active
      - api_key_id: eaa59659-7fab-4d1f-a80d-4f1e0f9388e4
        customer_name: Beta Foods
        quota_limit: 5000
        current_usage: 5000
        remaining: 0
        percentage_used: 100.0
        reset_date: '2026-03-01'
        period: monthly
        status: active
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
