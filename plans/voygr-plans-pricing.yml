note: >-
  VOYGR publishes a MACHINE-READABLE price list. The checkout page fetches
  GET /checkout/packs, which returns the credit packs as JSON with no
  authentication. Probed 2026-08-14, HTTP 200, application/json:
  [{"label":"1K","credits":1000,"price":"$10.00"},{"label":"2.5K","credits":2500,"price":"$24.00"},{"label":"5K","credits":5000,"price":"$45.00"}]
  There are no monthly subscription tiers — the model is prepaid credits plus a
  free grant. The company's location-data products (validation, enrichment) are
  still demo-gated on voygr.tech, but they draw on the SAME credit balance and
  the same published credit rates.
